name: Publish rendered analysis

"on":
  push:
    branches: [main]
    paths:
      - banded_dotterel_moult.html
      - .github/workflows/publish-analysis.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the rendered HTML
        uses: actions/checkout@v6
        with:
          sparse-checkout: /banded_dotterel_moult.html
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the website
        run: |
          mkdir -p _site
          cp banded_dotterel_moult.html _site/index.html

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
